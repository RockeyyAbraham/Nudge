<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Nudge | Sign In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter+Tight:wght@300;400;500;600;700;800&amp;family=Fraunces:opsz,wght@9..144,300;9..144,500&amp;family=Oxygen+Mono&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link href="assets/vivid/theme.css" rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#94a3b8",
                        "on-primary": "#0a0a0a",
                        "primary-container": "#334155",
                        "on-primary-container": "#f1f5f9",
                        "secondary": "#cbd5e1",
                        "secondary-container": "#1e293b",
                        "background": "#0a0a0a",
                        "surface": "#0a0a0a",
                        "surface-container": "#141414",
                        "surface-container-high": "#1e293b",
                        "surface-container-highest": "#334155",
                        "on-background": "#f8fafc",
                        "on-surface": "#f8fafc",
                        "on-surface-variant": "#94a3b8",
                        "outline": "#475569",
                        "outline-variant": "#1e293b",
                        "error": "#fca5a5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.75rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "display": ["Inter Tight", "Plus Jakarta Sans", "sans-serif"],
                        "body-lg": ["Inter Tight", "Plus Jakarta Sans", "sans-serif"],
                        "body-md": ["Inter Tight", "Plus Jakarta Sans", "sans-serif"]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #0a0a0a;
            color: #f8fafc;
            -webkit-font-smoothing: antialiased;
            font-family: 'Inter Tight', 'Plus Jakarta Sans', sans-serif;
        }
    </style>
    <!-- GSAP Core, SplitText (self-hosted copies of the Vivid Motion source libraries) -->
    <script src="assets/vivid/js/gsap.min.js"></script>
    <script src="assets/vivid/js/SplitText.min.js"></script>
    <script src="assets/vivid/js/motion.js"></script>
</head>

<body class="font-body-md selection:bg-primary/30 min-h-screen w-full flex items-center justify-center overflow-x-hidden overflow-y-auto relative py-6">

    <!-- Fullscreen grain-gradient background, shared with the rest of the app -->
    <canvas class="vivid-canvas" id="vivid-canvas"></canvas>
    <div class="absolute inset-0 z-[1] bg-[#0a0a0a]" id="login-transition-layer" aria-hidden="true"></div>

    <!-- Centered Login Card — real dream UI card treatment (.values-grid-card:
         8px radius, near-black fill, hairline border, no blur/glassmorphism) -->
    <div class="vivid-card relative z-10 w-full max-w-[440px] px-8 py-12 md:p-12 text-center flex flex-col items-center mx-4 opacity-0 translate-y-4" id="login-card">

        <!-- Small blue Nudge text logo — real mono-uppercase label treatment -->
        <span class="font-mono-vivid text-xs uppercase tracking-[0.25em] text-[#0088ff] mb-6" id="logo-text">Nudge</span>

        <!-- Login Title — real h1 treatment: display serif, ultralight, tight leading -->
        <h1 class="font-display-vivid text-5xl font-light text-white mb-3 tracking-tight leading-[1.05]" id="login-title">Welcome back.</h1>

        <!-- Subtext -->
        <p class="text-sm text-on-surface-variant mb-10 font-medium" id="login-subtext">Enter your email and password to continue.</p>

        <!-- Login form -->
        <form class="w-full flex flex-col gap-4" id="login-form">
            <div class="relative w-full" id="email-field">
                <input type="email" placeholder="Enter your email" required id="email-input" class="vivid-input" />
            </div>
            <div class="relative w-full" id="password-field">
                <input type="password" placeholder="Enter your password" required id="password-input" class="vivid-input" />
            </div>
            <div class="grid grid-cols-2 gap-4 mt-2" id="auth-actions">
                <button type="button" id="signup-btn" class="vivid-btn is-neutral w-full">
                    Sign Up
                </button>
                <button type="submit" id="login-btn" class="vivid-btn is-brand w-full">
                    Login
                </button>
            </div>
            <div class="hidden w-full flex flex-col gap-4 mt-2" id="otp-section">
                <div class="relative w-full">
                    <input type="text" inputmode="numeric" maxlength="8" placeholder="Enter OTP" id="otp-input" class="vivid-input" />
                </div>
                <button type="button" id="confirm-otp-btn" class="vivid-btn is-brand w-full">
                    Confirm
                </button>
                <button type="button" id="resend-otp-btn"
                    class="font-mono-vivid text-[11px] uppercase tracking-widest text-[#94a3b8]/70 hover:text-white transition-colors">
                    Resend OTP
                </button>
            </div>
            <p class="hidden text-sm text-error font-semibold" id="auth-error"></p>
        </form>

        <!-- Divider -->
        <div class="w-full flex items-center gap-4 my-8" id="login-divider">
            <div class="h-[1px] bg-white/8 flex-grow"></div>
            <span class="font-mono-vivid text-[10px] uppercase tracking-widest text-[#94a3b8]/40">OR</span>
            <div class="h-[1px] bg-white/8 flex-grow"></div>
        </div>

        <!-- Google OAuth Button — real .is-light variant (inverted: light fill, dark text) -->
        <button id="oauth-g" class="vivid-btn is-light w-full gap-3">
            <svg class="w-5 h-5" viewBox="0 0 24 24" width="20" height="20">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22c-.22-.66-.35-1.36-.35-2.09z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Continue with Google
        </button>

        <!-- Footer Text -->
        <p class="text-xs text-[#94a3b8]/50 mt-8 font-medium" id="login-footer">No account? We'll create one for you.</p>

    </div>

    <script>
        // Background canvas + entrance animation for the login card
        window.addEventListener('DOMContentLoaded', () => {
            initVividCanvas('vivid-canvas');

            gsap.to("#login-transition-layer", {
                opacity: 0,
                duration: 0.65,
                ease: "power2.out"
            });

            // Animate card container fade-in and slide-up
            gsap.to("#login-card", {
                opacity: 1,
                y: 0,
                duration: 1,
                ease: "power4.out"
            });

            // Text reveal for the headline, plain stagger fade for the rest
            initVividTextReveal("#login-title", { delay: 0.15 });

            const cardElements = [
                "#logo-text",
                "#login-subtext",
                "#login-form",
                "#login-divider",
                "#login-footer"
            ];

            gsap.from(cardElements, {
                opacity: 0,
                y: 10,
                duration: 0.8,
                stagger: 0.08,
                ease: "power2.out",
                delay: 0.15
            });

            const API_BASE = "http://localhost:5000/api/auth";
            const loginForm = document.getElementById("login-form");
            const loginSubtext = document.getElementById("login-subtext");
            const emailField = document.getElementById("email-field");
            const passwordField = document.getElementById("password-field");
            const emailInput = document.getElementById("email-input");
            const passwordInput = document.getElementById("password-input");
            const otpInput = document.getElementById("otp-input");
            const authActions = document.getElementById("auth-actions");
            const otpSection = document.getElementById("otp-section");
            const signupBtn = document.getElementById("signup-btn");
            const loginBtn = document.getElementById("login-btn");
            const confirmOtpBtn = document.getElementById("confirm-otp-btn");
            const resendOtpBtn = document.getElementById("resend-otp-btn");
            const authError = document.getElementById("auth-error");
            const loginDivider = document.getElementById("login-divider");
            const googleButton = document.getElementById("oauth-g");

            let pendingEmail = "";

            const showError = (message) => {
                authError.textContent = message;
                authError.classList.remove("hidden");
            };

            const clearError = () => {
                authError.textContent = "";
                authError.classList.add("hidden");
            };

            const setLoading = (button, isLoading, loadingText) => {
                if (isLoading) {
                    button.dataset.defaultText = button.textContent.trim();
                    button.textContent = loadingText;
                    button.disabled = true;
                    button.classList.add("opacity-70", "cursor-not-allowed");
                    return;
                }

                button.textContent = button.dataset.defaultText || button.textContent;
                button.disabled = false;
                button.classList.remove("opacity-70", "cursor-not-allowed");
            };

            const requestJson = async (path, body) => {
                const response = await fetch(`${API_BASE}${path}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(body)
                });
                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(data.message || "Something went wrong");
                }

                return data;
            };

            const saveSession = (data) => {
                if (data.session_token) {
                    localStorage.setItem("nudge_session_token", data.session_token);
                }

                if (data.user_id) {
                    localStorage.setItem("nudge_user_id", data.user_id);
                }
            };

            const redirectFromAuth = (redirect) => {
                if (redirect === "dashboard") {
                    window.location.href = "dashboard.html";
                    return;
                }

                window.location.href = "profilecompletion.html";
            };

            const showOtpState = (email) => {
                pendingEmail = email;
                emailField.classList.add("hidden");
                passwordField.classList.add("hidden");
                authActions.classList.add("hidden");
                loginDivider.classList.add("hidden");
                googleButton.classList.add("hidden");
                otpSection.classList.remove("hidden");
                loginSubtext.textContent = `Check your email for the verification code sent to ${email}`;
                otpInput.focus();
            };

            const signup = async (button) => {
                clearError();
                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError("Email and password are required");
                    return;
                }

                setLoading(button, true, "Sending...");
                try {
                    await requestJson("/signup", { email, password });
                    showOtpState(email);
                } catch (error) {
                    showError(error.message);
                } finally {
                    setLoading(button, false);
                }
            };

            signupBtn.addEventListener("click", () => signup(signupBtn));

            loginForm.addEventListener("submit", async (event) => {
                event.preventDefault();
                clearError();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                if (!email || !password) {
                    showError("Email and password are required");
                    return;
                }

                setLoading(loginBtn, true, "Logging in...");
                try {
                    const data = await requestJson("/login", { email, password });
                    saveSession(data);
                    redirectFromAuth(data.redirect);
                } catch (error) {
                    showError(error.message);
                } finally {
                    setLoading(loginBtn, false);
                }
            });

            confirmOtpBtn.addEventListener("click", async () => {
                clearError();
                const token = otpInput.value.trim();

                if (!token) {
                    showError("Enter the OTP sent to your email");
                    return;
                }

                setLoading(confirmOtpBtn, true, "Confirming...");
                try {
                    const data = await requestJson("/verify-otp", {
                        email: pendingEmail,
                        token
                    });
                    saveSession(data);
                    window.location.href = "profilecompletion.html";
                } catch (error) {
                    showError(error.message);
                } finally {
                    setLoading(confirmOtpBtn, false);
                }
            });

            resendOtpBtn.addEventListener("click", () => signup(resendOtpBtn));

            [emailInput, passwordInput, otpInput].forEach((input) => {
                input.addEventListener("input", clearError);
            });
        });
    </script>
</body>

</html>
