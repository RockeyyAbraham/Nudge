<style>
    body {
        background-color: #0a0a0a;
        color: #f8fafc;
        -webkit-font-smoothing: antialiased;
        font-family: 'Inter Tight', 'Plus Jakarta Sans', sans-serif;
    }

    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
    }

    /* Static settings-row label, distinct from the floating-label
       treatment used on the auth pages — this screen is a product
       surface, not a form, so labels sit quietly above the field. */
    .field-label {
        display: block;
        font-family: 'Oxygen Mono', Tahoma, sans-serif;
        font-size: 10.5px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: rgba(148, 163, 184, 0.65);
        margin-bottom: 9px;
    }

    .field-row {
        min-width: 0;
    }

    /* Hero avatar — the one signature element on the page: initials in
       the display serif, sitting inside a slow, breathing accent ring. */
    .avatar-hero {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        width: 92px;
        height: 92px;
        border-radius: 9999px;
        background: radial-gradient(circle at 32% 28%, rgba(0, 136, 255, 0.32), rgba(0, 136, 255, 0.08) 70%);
        border: 1px solid rgba(0, 136, 255, 0.35);
        color: #eaf4ff;
    }

    .avatar-hero::after {
        content: '';
        position: absolute;
        inset: -9px;
        border-radius: inherit;
        border: 1px solid rgba(0, 136, 255, 0.16);
        animation: avatar-pulse 3.6s ease-in-out infinite;
    }

    @keyframes avatar-pulse {
        0%, 100% { transform: scale(0.94); opacity: 0.55; }
        50% { transform: scale(1.04); opacity: 1; }
    }

    .member-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: 'Oxygen Mono', Tahoma, sans-serif;
        font-size: 10.5px;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: var(--vivid-fg-muted);
        border: 1px solid var(--vivid-border);
        background: rgba(148, 163, 184, 0.06);
        padding: 6px 12px;
        border-radius: 9999px;
    }

    /* Custom select — replaces the native <select>, which renders with
       OS chrome no CSS can touch and breaks the surface everywhere else
       on this page. */
    .select-trigger {
        width: 100%;
        height: 52px;
        padding: 0 16px !important;
        background-color: #141414 !important;
        color: #ffffff !important;
        border: 1px solid rgba(255, 255, 255, 0.1) !important;
        border-radius: 10px !important;
        font-family: 'Inter Tight', 'Plus Jakarta Sans', sans-serif;
        font-size: 14.5px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: border-color .18s ease, box-shadow .18s ease, background-color .18s ease;
    }

    .select-trigger[data-placeholder="true"] {
        color: rgba(148, 163, 184, 0.65) !important;
    }

    .select-trigger:focus-visible,
    .select-trigger.is-open {
        outline: none;
        border-color: var(--vivid-accent) !important;
        box-shadow: 0 0 0 3px var(--vivid-accent-soft);
    }

    .select-trigger .material-symbols-outlined {
        font-size: 19px;
        color: rgba(148, 163, 184, 0.75);
        transition: transform .2s ease;
    }

    .select-trigger.is-open .material-symbols-outlined {
        transform: rotate(180deg);
    }

    .select-panel {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 8px);
        z-index: 30;
        background: #171717;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        box-shadow: 0 16px 40px -12px rgba(0, 0, 0, 0.55);
        padding: 6px;
        max-height: 232px;
        overflow-y: auto;
        transform-origin: top center;
        transition: opacity .14s ease, transform .14s ease;
    }

    .select-panel[hidden] {
        display: none;
    }

    .select-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 9px 12px;
        border-radius: 7px;
        font-size: 14px;
        font-weight: 500;
        color: #d6dbe3;
        cursor: pointer;
        transition: background-color .12s ease, color .12s ease;
    }

    .select-option:hover,
    .select-option.is-active {
        background: rgba(0, 136, 255, 0.12);
        color: #ffffff;
    }

    .select-option[aria-selected="true"] {
        color: var(--vivid-accent);
    }

    .select-option .material-symbols-outlined {
        font-size: 17px;
        opacity: 0;
    }

    .select-option[aria-selected="true"] .material-symbols-outlined {
        opacity: 1;
    }

    .vivid-input:disabled {
        opacity: 0.55;
        cursor: not-allowed;
    }

    .settings-card {
        display: flex;
        flex-direction: column;
    }

    .danger-row {
        border-color: rgba(252, 165, 165, 0.18) !important;
    }

    /* Read-only detail rows with a per-field edit affordance — a settings
       list, not a form dumped open all at once. */
    .detail-list > .detail-row:not(:last-child) {
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .detail-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 15px 0;
    }

    .detail-row-body {
        flex: 1;
        min-width: 0;
    }

    .detail-row-body .field-label {
        margin-bottom: 6px;
    }

    .detail-value {
        display: block;
        font-size: 14.5px;
        font-weight: 500;
        color: #ffffff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .detail-input.vivid-input {
        height: 44px !important;
        padding: 0 14px !important;
        font-size: 14px !important;
    }

    .detail-edit-btn {
        flex-shrink: 0;
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: rgba(148, 163, 184, 0.55);
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background-color .15s ease, color .15s ease, border-color .15s ease;
    }

    .detail-edit-btn:hover {
        background: rgba(0, 136, 255, 0.1);
        color: var(--vivid-accent);
        border-color: rgba(0, 136, 255, 0.25);
    }

    .detail-edit-btn .material-symbols-outlined {
        font-size: 17px;
    }

    .detail-row.is-editing .detail-edit-btn {
        color: var(--vivid-accent);
        background: rgba(0, 136, 255, 0.12);
        border-color: rgba(0, 136, 255, 0.3);
    }

    /* Password card — collapsed by default, slides open on request */
    .password-slide {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition: max-height .35s cubic-bezier(.2, .8, .2, 1), opacity .25s ease;
    }

    .password-slide.is-open {
        max-height: 480px;
        opacity: 1;
    }

    @media (prefers-reduced-motion: reduce) {
        .avatar-hero::after {
            animation: none;
        }

        .password-slide {
            transition: none;
        }
    }
</style>

<main class="relative z-10 max-w-4xl mx-auto px-6 md:px-10 pt-28 pb-24" id="profile-main">

    <!-- Identity header — the hero moment for this page -->
    <div class="flex items-center gap-6 mb-4" id="profile-identity">
        <div class="avatar-hero" id="profile-avatar">
            <span class="font-display-vivid text-3xl font-medium relative z-10">·</span>

            <div class="flex items-center gap-2.5 mb-6">
                <span class="material-symbols-outlined text-[#0088ff] text-[20px]">badge</span>

                    <div class="detail-row" data-row="full-name">

                    <div class="detail-row" data-row="semester">

<script>
    initVividCanvas('vivid-canvas');

    const API_BASE = "http://localhost:5000/api/auth";
    const sessionToken = localStorage.getItem("nudge_session_token");

    if (!sessionToken) {
        window.location.href = "login.html";
    }

    const fullNameInput = document.getElementById("full-name-input");
    const universityInput = document.getElementById("university-input");
    const semesterInput = document.getElementById("semester-input");
    const fullNameValueEl = document.getElementById("full-name-value");
    const universityValueEl = document.getElementById("university-value");
    const semesterValueEl = document.getElementById("semester-value");
    const emailValueEl = document.getElementById("email-value");
    const profileNameEl = document.getElementById("profile-name");
    const profileEmailEl = document.getElementById("profile-email");
    const memberChip = document.getElementById("member-chip");
    const memberSinceText = document.getElementById("member-since-text");
    const navAvatarEl = document.getElementById("nav-avatar");
    const profileAvatarEl = document.getElementById("profile-avatar")?.querySelector("span");

    const setAvatarInitial = (fullName, email) => {
        const source = (fullName || email || "?").trim();
        const initial = source.charAt(0).toUpperCase();
        if (navAvatarEl) navAvatarEl.textContent = initial;
        if (profileAvatarEl) profileAvatarEl.textContent = initial;
    };

    // ---- Custom semester dropdown ------------------------------------
    const SEMESTERS = [1, 2, 3, 4, 5, 6, 7, 8];
    const trigger = document.getElementById("semester-trigger");
    const triggerText = document.getElementById("semester-trigger-text");
    const panel = document.getElementById("semester-panel");
    let activeIndex = -1;

    SEMESTERS.forEach((n) => {
        const li = document.createElement("li");
        li.className = "select-option";
        li.setAttribute("role", "option");
        li.setAttribute("data-value", String(n));
        li.setAttribute("aria-selected", "false");
        li.innerHTML = `<span>Semester ${n}</span><span class="material-symbols-outlined">check</span>`;
        panel.appendChild(li);
    });

    const options = Array.from(panel.querySelectorAll(".select-option"));

    const closeSemesterPanel = () => {
        panel.hidden = true;
        trigger.classList.remove("is-open");
        trigger.setAttribute("aria-expanded", "false");
        activeIndex = -1;
        options.forEach((o) => o.classList.remove("is-active"));
    };

    const openSemesterPanel = () => {
        panel.hidden = false;
        trigger.classList.add("is-open");
        trigger.setAttribute("aria-expanded", "true");
        const selected = options.findIndex((o) => o.getAttribute("aria-selected") === "true");
        activeIndex = selected >= 0 ? selected : 0;
        options[activeIndex]?.classList.add("is-active");
    };

    const selectSemester = (value) => {
        semesterInput.value = String(value);
        triggerText.textContent = `Semester ${value}`;
        semesterValueEl.textContent = `Semester ${value}`;
        trigger.setAttribute("data-placeholder", "false");
        options.forEach((o) => {
            const isMatch = o.getAttribute("data-value") === String(value);
            o.setAttribute("aria-selected", isMatch ? "true" : "false");
        });
        clearMessages(profileError, profileSuccess);
    };

    trigger.addEventListener("click", () => {
        if (panel.hidden) openSemesterPanel(); else closeSemesterPanel();
    });

    options.forEach((option, index) => {
        option.addEventListener("click", () => {
            selectSemester(option.getAttribute("data-value"));
            closeSemesterPanel();
            trigger.focus();
        });
        option.addEventListener("mouseenter", () => {
            options.forEach((o) => o.classList.remove("is-active"));
            option.classList.add("is-active");
            activeIndex = index;
        });
    });

    trigger.addEventListener("keydown", (event) => {
        if (["ArrowDown", "ArrowUp", "Enter", " "].includes(event.key)) {
            event.preventDefault();
        }
        if (panel.hidden && ["ArrowDown", "ArrowUp", "Enter", " "].includes(event.key)) {
            openSemesterPanel();
            return;
        }
        if (event.key === "ArrowDown") {
            activeIndex = Math.min(activeIndex + 1, options.length - 1);
            options.forEach((o) => o.classList.remove("is-active"));
            options[activeIndex].classList.add("is-active");
            options[activeIndex].scrollIntoView({ block: "nearest" });
        } else if (event.key === "ArrowUp") {
            activeIndex = Math.max(activeIndex - 1, 0);
            options.forEach((o) => o.classList.remove("is-active"));
            options[activeIndex].classList.add("is-active");
            options[activeIndex].scrollIntoView({ block: "nearest" });
        } else if (event.key === "Enter" || event.key === " ") {
            if (activeIndex >= 0) {
                selectSemester(options[activeIndex].getAttribute("data-value"));
                closeSemesterPanel();
            }
        } else if (event.key === "Escape") {
            closeSemesterPanel();
        } else if (event.key === "Tab") {
            closeSemesterPanel();
        }
    });

    document.addEventListener("click", (event) => {
        if (!trigger.contains(event.target) && !panel.contains(event.target)) {
            closeSemesterPanel();
        }
    });

    // ---- Per-field inline editing (pencil icon reveals the box) -----------
    let lastCommitted = { fullName: "", university: "", semester: "" };

    const setRowEditing = (rowKey, editing) => {
        const row = document.querySelector(`.detail-row[data-row="${rowKey}"]`);
        if (!row) return;
        row.classList.toggle("is-editing", editing);

        const value = row.querySelector(".detail-value");
        const control = row.querySelector(".detail-input");
        if (value) value.classList.toggle("hidden", editing);
        if (control) control.classList.toggle("hidden", !editing);

        const icon = row.querySelector(".detail-edit-btn .material-symbols-outlined");
        if (icon) icon.textContent = editing ? "close" : "edit";

        if (editing) {
            if (rowKey === "semester") {
                trigger.focus();
            } else {
                control?.focus();
                control?.select?.();
            }
        }
    };

    document.querySelectorAll(".detail-edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
            const rowKey = btn.dataset.edit;
            const row = btn.closest(".detail-row");
            const isEditing = row.classList.contains("is-editing");

            if (isEditing) {
                if (rowKey === "full-name") fullNameInput.value = lastCommitted.fullName;
                if (rowKey === "university") universityInput.value = lastCommitted.university;
                if (rowKey === "semester") selectSemester(lastCommitted.semester);
                setRowEditing(rowKey, false);
                clearMessages(profileError, profileSuccess);
            } else {
                setRowEditing(rowKey, true);
            }
        });
    });

    [
        [fullNameInput, "full-name"],
        [universityInput, "university"]
    ].forEach(([input, rowKey]) => {
        input.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                document.querySelector(`.detail-edit-btn[data-edit="${rowKey}"]`)?.click();
            }
        });
    });

    // ---- Load profile --------------------------------------------------
    const formatMemberSince = (isoString) => {
        if (!isoString) return null;
        const date = new Date(isoString);
        if (Number.isNaN(date.getTime())) return null;
        return date.toLocaleDateString("en-US", { month: "short", year: "numeric" });
    };

    const loadProfile = async () => {
        try {
            const response = await fetch(`${API_BASE}/me`, {
                headers: { "Authorization": `Bearer ${sessionToken}` }
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok || !data || data.status !== "success") {
                window.location.href = "login.html";
                return;
            }

            const { user, profile } = data;

            fullNameInput.value = profile.full_name || "";
            universityInput.value = profile.university || "";
            fullNameValueEl.textContent = profile.full_name || "—";
            universityValueEl.textContent = profile.university || "—";
            emailValueEl.textContent = user.email || "";

            if (profile.semester) {
                selectSemester(profile.semester);
            } else {
                semesterValueEl.textContent = "—";
            }

            lastCommitted = {
                fullName: profile.full_name || "",
                university: profile.university || "",
                semester: profile.semester || ""
            };

            profileNameEl.textContent = profile.full_name || "Your profile";
            profileEmailEl.textContent = user.email || "";

            const memberSince = formatMemberSince(user.created_at);
            if (memberSince) {
                memberSinceText.textContent = `Member since ${memberSince}`;
                memberChip.hidden = false;
            }

            setAvatarInitial(profile.full_name, user.email);
        } catch (error) {
            window.location.href = "login.html";
        }
    };

    if (sessionToken) {
        loadProfile();
    }

    // ---- Shared helpers --------------------------------------------------
    const showMessage = (el, message) => {
        el.textContent = message;
        el.classList.remove("hidden");
    };

    const clearMessages = (...els) => {
        els.forEach((el) => {
            el.textContent = "";
            el.classList.add("hidden");
        });
    };

    const setLoading = (button, isLoading, loadingText) => {
        if (isLoading) {
            button.dataset.defaultText = button.dataset.defaultText || button.textContent.trim();
            button.textContent = loadingText;
            button.disabled = true;
            button.classList.add("opacity-70", "cursor-not-allowed");
            return;
        }

        button.textContent = button.dataset.defaultText || button.textContent;
        button.disabled = false;
        button.classList.remove("opacity-70", "cursor-not-allowed");
    };

    // ---- Profile details form --------------------------------------------
    const profileForm = document.getElementById("profile-form");
    const profileError = document.getElementById("profile-error");
    const profileSuccess = document.getElementById("profile-success");
    const saveProfileBtn = document.getElementById("save-profile-btn");

    [fullNameInput, universityInput].forEach((input) => {
        input.addEventListener("input", () => clearMessages(profileError, profileSuccess));
    });

    profileForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessages(profileError, profileSuccess);

        const fullName = fullNameInput.value.trim();
        const university = universityInput.value.trim();
        const semesterRaw = semesterInput.value;
        const semester = semesterRaw ? parseInt(semesterRaw, 10) : null;

        if (!fullName || !university || !semesterRaw) {
            showMessage(profileError, "Fill in your name, university and semester to continue.");
            return;
        }

        setLoading(saveProfileBtn, true, "Saving...");
        try {
            const response = await fetch(`${API_BASE}/update-profile`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${sessionToken}`
                },
                body: JSON.stringify({ full_name: fullName, university, semester })
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.message || "Failed to update profile");
            }

            fullNameValueEl.textContent = fullName;
            universityValueEl.textContent = university;
            lastCommitted = { fullName, university, semester };
            ["full-name", "university", "semester"].forEach((rowKey) => setRowEditing(rowKey, false));

            profileNameEl.textContent = fullName;
            setAvatarInitial(fullName, emailValueEl.textContent);
            showMessage(profileSuccess, "Profile updated.");
        } catch (error) {
            showMessage(profileError, error.message);
        } finally {
            setLoading(saveProfileBtn, false);
        }
    });

    // ---- Password change — collapsed behind "Reset password" --------------
    const passwordForm = document.getElementById("password-form");
    const passwordSummary = document.getElementById("password-summary");
    const passwordSlide = document.getElementById("password-slide");
    const resetPasswordBtn = document.getElementById("reset-password-btn");
    const cancelPasswordBtn = document.getElementById("cancel-password-btn");
    const currentPasswordInput = document.getElementById("current-password-input");
    const newPasswordInput = document.getElementById("new-password-input");
    const confirmPasswordInput = document.getElementById("confirm-password-input");
    const passwordError = document.getElementById("password-error");
    const passwordSuccess = document.getElementById("password-success");
    const savePasswordBtn = document.getElementById("save-password-btn");

    const openPasswordSlide = () => {
        passwordSlide.classList.add("is-open");
        passwordSummary.classList.add("hidden");
        currentPasswordInput.focus();
    };

    const closePasswordSlide = () => {
        passwordSlide.classList.remove("is-open");
        passwordSummary.classList.remove("hidden");
        passwordForm.reset();
        clearMessages(passwordError, passwordSuccess);
    };

    resetPasswordBtn.addEventListener("click", openPasswordSlide);
    cancelPasswordBtn.addEventListener("click", closePasswordSlide);

    [currentPasswordInput, newPasswordInput, confirmPasswordInput].forEach((input) => {
        input.addEventListener("input", () => clearMessages(passwordError, passwordSuccess));
    });

    passwordForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        clearMessages(passwordError, passwordSuccess);

        const currentPassword = currentPasswordInput.value;
        const newPassword = newPasswordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        if (!currentPassword || !newPassword || !confirmPassword) {
            showMessage(passwordError, "Fill in all three password fields.");
            return;
        }

        if (newPassword.length < 6) {
            showMessage(passwordError, "New password must be at least 6 characters.");
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage(passwordError, "New passwords don't match.");
            return;
        }

        setLoading(savePasswordBtn, true, "Updating...");
        try {
            const response = await fetch(`${API_BASE}/change-password`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${sessionToken}`
                },
                body: JSON.stringify({ current_password: currentPassword, new_password: newPassword })
            });
            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                throw new Error(data.message || "Failed to update password");
            }

            passwordForm.reset();
            showMessage(passwordSuccess, "Password updated.");
            setTimeout(closePasswordSlide, 1400);
        } catch (error) {
            showMessage(passwordError, error.message);
        } finally {
            setLoading(savePasswordBtn, false);
        }
    });

    // ---- Sign out ----------------------------------------------------------
    document.getElementById("logout-btn").addEventListener("click", async () => {
        try {
            await fetch(`${API_BASE}/logout`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${sessionToken}` }
            });
        } catch (error) {
            // Ignore network errors on logout — clear the local session regardless
        } finally {
            localStorage.removeItem("nudge_session_token");
            localStorage.removeItem("nudge_user_id");
            window.location.href = "login.html";
        }
    });

    // Gentle entrance animation, matching the rest of the app
    if (typeof gsap !== 'undefined' && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        gsap.from('#profile-identity, #profile-grid > *, main > .danger-row', {
            opacity: 0,
            y: 14,
            duration: 0.7,
            stagger: 0.08,
            ease: 'power2.out'
        });
    }
</script>
</body>

</html>
